services:
  - type: web
    name: smart-asset-tracker
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DEFAULT_ASSET_ID
        value: "ASSET-ESP32-01"
      - key: DEFAULT_GEOFENCE_RADIUS_METERS
        value: "500"
      - key: DEVICE_SECRET_TOKEN
        value: "esp32_token_mca_default"
      - key: DASHBOARD_API_KEY
        value: "dashboard_admin_key_mca_2026"
